# docker-compose.yml — Oráculo UEMA v6.3 (Dev/Stable - Optimized)
networks:
  oraculo_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:

# ── Modelos Base (Âncoras YAML) ────────────────────────────────────────────────
x-app-env: &app-env
  env_file: .env
  environment:
    # IPs fixos para mitigar falhas de DNS do subsistema WSL
    REDIS_URL: "redis://172.18.0.50:6379/0"
    DATABASE_URL: "postgresql+asyncpg://user:${POSTGRES_PASSWORD}@172.18.0.40:5432/oraculo"
    LLAMA_CLOUD_API_KEY: "${LLAMA_CLOUD_API_KEY}"

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-build: &build
  image: oraculo-app:latest
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime

# Modelo unificado para todos os workers do Celery (evita duplicação massiva de volumes e dependências)
x-worker-base: &worker-base
  <<: [*build, *restart, *logging, *app-env]
  # DNS externo explícito: o resolver padrão do Docker no WSL2 falha para hosts
  # fora da rede do compose (huggingface.co, sis.sig.uema.br, ghcr.io no build)
  dns:
    - 8.8.8.8
    - 1.1.1.1
  volumes:
    - ./src:/app/src
    - ./langgraph_experiment:/app/langgraph_experiment
    - ./rest_lab:/app/rest_lab
    - ./mcp_lab:/app/mcp_lab
    - ./dados:/app/dados
    # Isolamento de segurança: mapeia pasta temporária interna ao invés de expor o host /tmp
    - ./dados/tmp:/tmp
  networks:
    - oraculo_net
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# ── Perfis de recursos (contenção de memória/CPU por container) ────────────────
# Usamos mem_limit/cpus (chaves "legacy" do Compose) em vez de deploy.resources:
# deploy.* só é aplicado de fato em modo Swarm ou com `--compatibility`. Em
# `docker compose up` local (não-swarm), deploy.resources.limits é ignorado
# silenciosamente — o container sobe sem teto real de RAM/CPU, mesmo aparecendo
# no YAML. mem_limit/cpus são sempre respeitados pelo engine, com ou sem swarm.
x-resources-light: &resources-light
  mem_limit: 512m
  cpus: 0.5

x-resources-heavy: &resources-heavy
  mem_limit: 1024m
  mem_reservation: 256m
  cpus: 1.5

# rag_search é o único worker com lib C persistente propensa a vazamento
# gradual (CrossEncoder/torch, pré-carregado só aqui via CELERY_PRELOAD_RERANKER
# — ver celery_app.py::on_worker_process_init). synthesis/media/graph não têm
# esse perfil (API HTTP / yt-dlp por chamada, sem estado nativo entre tasks),
# por isso rodam --pool=solo com budget mais enxuto.
x-resources-solo: &resources-solo
  mem_limit: 512m
  cpus: 1.0

services:
  # ── Infraestrutura Oráculo ──
  postgres:
    image: postgres:16-alpine
    container_name: oraculo_postgres
    <<: [*restart, *logging]
    profiles: ["core"]
    mem_limit: 1024m
    cpus: 1.0
    networks:
      oraculo_net:
        ipv4_address: 172.18.0.40
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oraculo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d oraculo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:latest
    container_name: oraculo_redis
    <<: [*restart, *logging]
    profiles: ["core"]
    mem_limit: 1024m
    cpus: 1.0
    networks:
      oraculo_net:
        ipv4_address: 172.18.0.50
    volumes:
      - redis_data:/data
    environment:
      REDIS_ARGS: "--appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: oraculo_redis_exporter
    <<: [*restart, *logging, *resources-light]
    profiles: ["core"]
    environment:
      REDIS_ADDR: "redis://172.18.0.50:6379"
    networks:
      - oraculo_net

  # ── Observabilidade (Prometheus/Grafana) ──
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: oraculo_prometheus
    <<: [*restart, *logging, *resources-light]
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - oraculo_net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: oraculo_grafana
    <<: [*restart, *logging, *resources-light]
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "redis-datasource"
    volumes:
      - grafana_data:/var/lib/grafana
      # Sem isso, datasource e dashboards em observability/grafana/provisioning/
      # nunca chegam ao container — achado real desta sessão, provisioning
      # existia no repo mas não era montado em lugar nenhum.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - oraculo_net

  # ── Aplicação Principal e Migrações ──
  migration:
    <<: [*build, *app-env, *resources-light]
    container_name: oraculo_migration
    profiles: ["app"]
    command: ["alembic", "upgrade", "head"]
    networks:
      - oraculo_net
    restart: "no"
    volumes:
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*build, *restart, *logging, *app-env]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: oraculo_api
    profiles: ["app"]
    mem_limit: 1536m
    cpus: 1.5
    # --workers 1 em dev: 2 processos uvicorn dobram a carga do modelo de
    # embeddings/CrossEncoder na RAM e estouravam o mem_limit, causando
    # OOM-kill silencioso (container reiniciando sem log de startup)
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "9000", "--workers", "1", "--loop", "uvloop", "--no-access-log"]
    ports:
      - "${API_PORT:-9000}:9000"
    volumes:
      - ./src:/app/src
      - ./langgraph_experiment:/app/langgraph_experiment
      - ./rest_lab:/app/rest_lab
      - ./mcp_lab:/app/mcp_lab
      - ./dados:/app/dados
      - ./dados/tmp:/tmp
      - ./migrations:/app/migrations
      - ./templates:/app/templates
      - ./static:/app/static
    networks:
      - oraculo_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Workers Distribuidos Celery ──
  worker:
    <<: *worker-base
    container_name: oraculo_worker
    profiles: ["app"]
    mem_limit: 768m
    cpus: 1.0
    # concurrency=1 (não 2): este container concentra 3 fontes de pressão de
    # memória no mesmo processo — Playwright (Chromium por fluxo SIGAA,
    # browser.py::_init_playwright), o event loop asyncio persistente do
    # LangGraph (run_in_worker_loop, celery_app.py) e o parsing de PDF de
    # histórico (fitz). Rodar 2 filhos dobraria os 3 picos ao mesmo tempo.
    # max-tasks-per-child mais baixo que antes (500→200): recicla mais cedo
    # por segurança dado esse acúmulo. Fica em prefork (não solo) de propósito
    # — precisa do fork pra reciclar via max-tasks-per-child, e fork+Playwright
    # é o padrão testado (solo colocaria Playwright no mesmo processo/loop do
    # supervisor Celery).
    environment:
      CELERY_PRELOAD_RERANKER: "false"
    command: ["celery", "-A", "src.infrastructure.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--max-tasks-per-child=200", "--queues=default,admin,notificacoes"]

  worker_rag:
    <<: [*worker-base, *resources-heavy]
    container_name: oraculo_worker_rag
    profiles: ["app"]
    # Único worker com lib C persistente propensa a vazamento gradual
    # (CrossEncoder/torch em sentence-transformers) — fica em prefork
    # (default, sem --pool) justamente para poder reciclar via
    # max-tasks-per-child=100. CELERY_PRELOAD_RERANKER=true é o único
    # container que deve pagar o custo do preload do CrossEncoder
    # (worker_process_init em celery_app.py é global ao app Celery,
    # dispararia em todos sem esse gate).
    environment:
      CELERY_PRELOAD_RERANKER: "true"
    command: ["celery", "-A", "src.infrastructure.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--max-tasks-per-child=100", "--queues=rag_search"]

  worker_synthesis:
    <<: [*worker-base, *resources-solo]
    container_name: oraculo_worker_synthesis
    profiles: ["app"]
    # --pool=solo: só chama Gemini via HTTP (SynthesisService), sem lib C
    # persistente — não há vazamento pra mitigar com fork+max-tasks-per-child,
    # então o fork só pagaria overhead de import duplicado à toa.
    environment:
      CELERY_PRELOAD_RERANKER: "false"
    command: ["celery", "-A", "src.infrastructure.celery_app.celery_app", "worker", "--loglevel=info", "--pool=solo", "--queues=synthesis"]

  worker_media:
    <<: *worker-base
    container_name: oraculo_worker_media
    profiles: ["app"]
    mem_limit: 768m
    cpus: 1.0
    # --pool=solo: yt-dlp/instaloader instanciados por chamada (media_download_
    # service.py), sem estado nativo entre tasks. mem_limit um pouco acima do
    # resources-solo padrão por causa de buffers de download de vídeo.
    environment:
      CELERY_PRELOAD_RERANKER: "false"
    command: ["celery", "-A", "src.infrastructure.celery_app.celery_app", "worker", "--loglevel=info", "--pool=solo", "--queues=media"]

  # worker_graph removido do compose (2026-07-31): fila "graph"/worker_graph_extractor
  # nunca teve chamador real em produção (nenhum router/agent/use_case despacha
  # "graph_extractor" — confirmado por grep, não só por nota antiga). Código e task
  # continuam existindo (worker_graph_extractor.py, registry.py, celery_app.py) —
  # é só reativar este serviço se aparecer um uso real futuro.

  beat:
    <<: [*worker-base, *resources-light]
    container_name: oraculo_beat
    profiles: ["app"]
    command: ["celery", "-A", "src.infrastructure.celery_app.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]

  # ── EVOLUTION API v2.3.7 (imagem oficial pré-compilada) ──
  # Nota: o Docker Hub do projeto mudou de organização — não é mais "atendai/evolution-api".
  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: oraculo_evolution
    <<: [*restart, *logging]
    profiles: ["gateway"]
    mem_limit: 1024m
    cpus: 1.0
    ports:
      - "8081:8080"
    networks:
      - oraculo_net
    environment:
      - SERVER_URL=http://localhost:8081
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - TZ=America/Sao_Paulo
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://user:${POSTGRES_PASSWORD}@172.18.0.40:5432/oraculo?schema=evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://172.18.0.50:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - WEBHOOK_GLOBAL_URL=http://api:9000/webhook/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      # --- Configurações de Comportamento Limpo ---
      - DEL_MESSAGE_INSTANCE=true           # Evita acumular lixo no banco da instância
      - WA_BUSINESS_TOKEN_VALIDATION=false  # Desativa validação pesada se não estiver usando API oficial
      # Estas flags abaixo controlam o que é enviado ao webhook
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_MESSAGES_DELETE=false # Recomendado: ignorar eventos de deleção
      - WEBHOOK_EVENTS_GROUPS_UPSERT=false
      - SYNCFULLHISTORY=false
      

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy