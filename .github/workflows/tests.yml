name: Tests

# CI mínimo (Fase 1 de pesquisa_arquitetura_producao.md §6): liga o que já
# existe a um pipeline automático — não é adoção de framework novo, é só
# automatizar o que já rodava manualmente.
#
# Descoberta feita ao rodar a suíte pela primeira vez fora do ambiente do
# dev (esta sessão, 2026-08-15): ao contrário do que a docstring de
# tests/conftest.py sugere ("unit → sem IO"), boa parte de tests/unit
# depende de Redis/Postgres reais (RBAC, memória operacional, LangGraph
# HITL) — não são miscategorizados de propósito, é que "unit" aqui
# significa "sem servidor HTTP rodando", não "sem infra nenhuma". Por
# isso os services abaixo, com os MESMOS defaults que
# tests/conftest.py já usa (REDIS_URL db 15, DATABASE_URL porta 5433,
# usuário/senha/banco `user`/`pass`/`oraculo_test`) — zero mudança de
# código pra CI funcionar, só prover a infra que os testes já esperavam.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: oraculo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5433/oraculo_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Rodar migrations (schema pro Postgres de teste)
        run: alembic upgrade head

      - name: Rodar tests/unit
        # TD-018 corrigido (ADR 0008 Fase 3): os testes de
        # test_registration_repository.py agora forçam DEV_TEST_NO_DB_WRITE=False
        # via fixture, então rodam de novo no CI.
        run: pytest tests/unit -v --tb=short

      - name: Rodar eval do scraper wiki CTIC (fixtures congeladas)
        run: pytest tests/eval/test_ctic_wiki_eval.py -v --tb=short
