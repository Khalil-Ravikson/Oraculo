[pytest]
; Registro dos markers já documentados em tests/conftest.py — sem isso,
; pytest emite PytestUnknownMarkWarning pra cada um. Não estava registrado
; em lugar nenhum do repo antes (pyproject.TOML é o único candidato e está
; marcado "#desatualizado:#" pelo próprio time, sem seção [tool.pytest]).
markers =
    unit: testes sem IO externo
    integration: precisa Redis local
    rag_eval: avaliação de qualidade RAG
    e2e: precisa servidor rodando
    llm: chama LLM real (caro, rodar só sob demanda)
    slow: testes lentos (>5s)
asyncio_mode = strict
