{% extends "hub/_shell.html" %}
{% block nav_active %}users{% endblock %}
{% block page_title %}Pessoas{% endblock %}

{% block content %}
<div class="grid" id="stats" style="margin-bottom:var(--space-5)"></div>

<div class="section__head" style="gap:var(--space-2);flex-wrap:wrap">
  <input class="input" id="q" placeholder="Buscar nome, telefone, e-mail…" style="max-width:280px">
  <select class="select" id="f-role" style="max-width:160px"><option value="">Todos os papéis</option>
    <option>estudante</option><option>publico</option><option>professor</option><option>servidor</option><option>coordenador</option><option>admin</option></select>
  <select class="select" id="f-status" style="max-width:140px"><option value="">Todos</option><option value="true">Ativos</option><option value="false">Inativos</option></select>
  <button class="btn btn--primary btn--sm" id="novo">+ Nova pessoa</button>
</div>

<div class="table-wrap">
  <table class="table">
    <thead><tr><th class="num">#</th><th>nome</th><th>telefone</th><th>e-mail</th><th>papel</th><th>estado</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="table__empty">Carregando…</td></tr></tbody>
  </table>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:var(--space-3)">
  <span class="caption" id="pag-info">—</span>
  <span><button class="btn btn--sm" id="prev" disabled>← Anterior</button> <button class="btn btn--sm" id="next" disabled>Próximo →</button></span>
</div>

<div class="modal-overlay" id="modal" hidden><div class="modal">
  <div class="modal__head"><span class="modal__title" id="m-title">Nova pessoa</span><button class="btn btn--ghost btn--sm" id="m-x">✕</button></div>
  <div class="modal__body">
    <input type="hidden" id="edit-id">
    <div class="field"><label class="field__label">Nome</label><input class="input" id="f-nome"></div>
    <div class="field"><label class="field__label">Telefone (só números)</label><input class="input" id="f-telefone" placeholder="5598999999999"></div>
    <div class="field"><label class="field__label">E-mail</label><input class="input" type="email" id="f-email"></div>
    <div class="field"><label class="field__label">Papel</label><select class="select" id="f-role2">
      <option>estudante</option><option>publico</option><option>professor</option><option>servidor</option><option>coordenador</option><option>admin</option></select></div>
    <div class="field"><label class="field__label">Turno</label><select class="select" id="f-turno">
      <option value="">— nenhum —</option><option>matutino</option><option>vespertino</option><option>noturno</option><option>ead</option></select></div>
    <div class="field"><label class="field__label">Curso</label><input class="input" id="f-curso"></div>
    <div class="field"><label class="field__label">Matrícula</label><input class="input" id="f-matricula"></div>
    <label class="toggle"><input type="checkbox" id="f-ativo" checked><span class="toggle__track"></span><span>Pode usar o chatbot</span></label>
  </div>
  <div class="modal__foot"><button class="btn" id="m-cancel">Cancelar</button><button class="btn btn--primary" id="m-save">Salvar</button></div>
</div></div>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/pages/users.js"></script>
{% endblock %}
