{% extends "hub/_shell.html" %}
{% block nav_active %}audit{% endblock %}
{% block page_title %}Auditoria{% endblock %}

{% block content %}
<div class="section__head" style="gap:var(--space-2);flex-wrap:wrap">
  <input class="input" id="q" placeholder="Filtrar por admin, ação, alvo…" style="max-width:320px">
  <select class="select" id="lim" style="max-width:140px"><option value="100">100</option><option value="300">300</option><option value="1000">1000</option></select>
  <button class="btn btn--sm" id="refresh">Atualizar</button>
</div>

<div class="table-wrap">
  <table class="table">
    <thead><tr><th>quando</th><th>admin</th><th>ação</th><th>alvo</th><th>resultado</th><th>detalhes</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="table__empty">Carregando…</td></tr></tbody>
  </table>
</div>
<div class="caption" id="info" style="margin-top:var(--space-3)"></div>
{% endblock %}

{% block scripts %}
<script type="module">
import { api } from '/static/js/core/api-client.js';
import { fmt } from '/static/js/core/format.js';

const $ = (id) => document.getElementById(id);
let TODAS = [];

const RES = { ok: 'badge--ok', alerta: 'badge--warn', erro: 'badge--danger' };

function render() {
  const q = $('q').value.trim().toLowerCase();
  const filtradas = q
    ? TODAS.filter(e => JSON.stringify(e).toLowerCase().includes(q))
    : TODAS;
  $('rows').innerHTML = filtradas.map(e => `
    <tr>
      <td class="caption mono">${fmt.dateTime(e.ts)}</td>
      <td>${fmt.esc(e.admin || '—')}</td>
      <td class="mono">${fmt.esc(e.action || '—')}</td>
      <td>${fmt.esc(e.target || '—')}</td>
      <td><span class="badge ${RES[e.result] || 'badge--neutral'}">${fmt.esc(e.result || '—')}</span></td>
      <td class="caption mono" style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.payload ? fmt.esc(JSON.stringify(e.payload)) : ''}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="table__empty">Nada encontrado.</td></tr>';
  $('info').textContent = `${filtradas.length} de ${TODAS.length} entradas`;
}

async function load() {
  $('rows').innerHTML = '<tr><td colspan="6" class="table__empty">Carregando…</td></tr>';
  try {
    const d = await api.get('/audit?limit=' + $('lim').value);
    TODAS = d.entries || [];
    render();
  } catch (e) {
    $('rows').innerHTML = `<tr><td colspan="6" style="color:var(--danger)">${fmt.esc(e.message)}</td></tr>`;
  }
}

$('q').oninput = render;
$('lim').onchange = load;
$('refresh').onclick = load;
load();
</script>
{% endblock %}
