<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso — Oráculo UEMA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b0d10'/%3E%3Ccircle cx='12' cy='12' r='6' fill='none' stroke='%23d97a3f' stroke-width='2'/%3E%3Cpath d='M12 4v16M4 12h16' stroke='%23262b33' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components/button.css">
  <link rel="stylesheet" href="/static/css/components/form.css">
  <link rel="stylesheet" href="/static/css/pages/login.css">
</head>
<body>
  <form class="login" method="post" action="/hub/login">
    <div class="login__brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>
      <div><b>Oráculo</b><small>console operacional</small></div>
    </div>

    <div class="field">
      <label class="field__label" for="username">Usuário</label>
      <input class="input" type="text" id="username" name="username" autofocus required autocomplete="username" placeholder="admin">
    </div>
    <div class="field">
      <label class="field__label" for="password">Senha</label>
      <input class="input" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
    </div>

    <button class="btn btn--primary" type="submit">Entrar</button>

    {% if erro %}<div class="login__err">{{ erro }}</div>{% endif %}
  </form>
</body>
</html>
